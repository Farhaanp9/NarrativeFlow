services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - NF_DB_PATH=/app/data/narrativeflow.db
      - NF_LLM_BASE_URL=http://ollama:11434/v1
      - NF_CORS_ORIGINS=["http://localhost:3000"]
    volumes:
      - backend-data:/app/data
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  backend-data:
  ollama-data:
