services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - NF_DB_PATH=/app/data/narrativeflow.db
      - NF_LLM_BASE_URL=${NF_LLM_BASE_URL:-http://ollama:11434/v1}
      - NF_LLM_MODEL
      - NF_CORS_ORIGINS=["http://localhost:3000"]
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

  # Optional local LLM: docker compose --profile llm up
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  backend-data:
  ollama-data:
