[project]
name = "narrativeflow"
version = "0.1.0"
description = "Multi-agent simulation engine for modeling misinformation spread through social networks"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "numpy>=2.1",
    "scipy>=1.14",
    "python-igraph>=0.11",
    "openai>=1.60",
    "aiosqlite>=0.20",
    "structlog>=24.4",
    "typer>=0.15",
    "websockets>=14.0",
]

[project.scripts]
narrativeflow = "narrativeflow.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "ollama: tests that require a running Ollama instance",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]
